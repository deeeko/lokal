<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lokal">
  <!-- Lokal, variant A: a Celo-yellow cursive L on the green tile.
       The L is the "L" of Sentient Medium Italic (Indian Type Foundry, ITF Free Font License, which allows logos),
       converted to outlines so the mark never depends on the font. -->
  <defs>
    <linearGradient id="lk-bg" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="416" y2="512">
      <stop offset="0" stop-color="#2FD98B"/>
      <stop offset=".5" stop-color="#00A862"/>
      <stop offset="1" stop-color="#005433"/>
    </linearGradient>
    <radialGradient id="lk-shine" gradientUnits="userSpaceOnUse" cx="140" cy="30" r="390">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lk-rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".65"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#00301C" stop-opacity=".55"/>
    </linearGradient>
    <!-- Celo yellow, as in the rails of the old mark -->
    <linearGradient id="lk-rail" gradientUnits="userSpaceOnUse" x1="96" y1="0" x2="512" y2="0">
      <stop offset="0" stop-color="#F2F548"/>
      <stop offset="1" stop-color="#FCFF52"/>
    </linearGradient>
    <linearGradient id="lk-gold" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="400">
      <stop offset="0" stop-color="#FCFF52"/>
      <stop offset="1" stop-color="#EEF23F"/>
    </linearGradient>
    <linearGradient id="lk-ink" gradientUnits="userSpaceOnUse" x1="0" y1="110" x2="0" y2="400">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4FBEF"/>
    </linearGradient>
    <filter id="lk-lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#00301C" flood-opacity=".5"/>
    </filter>
    <clipPath id="lk-tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#lk-tile)">
    <rect width="512" height="512" fill="url(#lk-bg)"/>
    <path filter="url(#lk-lift)" d="M360.6 395L141.6 395L143.6 382.2L159.3 375.7Q170.4 370.7 174.3 365.6Q178.2 360.4 179.5 350.1L205 168.2L207 150.5Q207 139.3 192.6 132.3L179 125.8L181.1 113L300.5 113L298.8 125.8L282.8 132.3Q272.1 137.3 268 142.4Q263.9 147.6 262.6 157.9L237.5 339.8Q235.9 351 235.9 356.3Q235.9 364.5 240.2 367.6Q244.5 370.7 255.6 370.7L298.8 370.7Q315.7 370.7 324.8 364.7Q333.8 358.8 351.5 335.7L369.7 311.8L382.4 311.8Z" fill="url(#lk-gold)" stroke="url(#lk-gold)" stroke-width="9" stroke-linejoin="round"/>
    <rect width="512" height="512" fill="url(#lk-shine)"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="url(#lk-rim)" stroke-width="6"/>
</svg>
